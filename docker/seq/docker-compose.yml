services:
  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: unless-stopped
    ports:
      - "6000:80"
    environment:
      - ACCEPT_EULA=Y 
      - SEQ_FIRSTRUN_ADMINPASSWORD=admin123
    volumes:
      - ./volumes:/data

