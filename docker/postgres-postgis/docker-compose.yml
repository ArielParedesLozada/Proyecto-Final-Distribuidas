services:
  postgis:
    container_name: pgis_ad
    image: postgis/postgis:17-master
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: proyecto-distribuidas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: clave_piola
    volumes:
      - /home/usuario/.docker/postgis:/var/lib/postgresql
    networks:
      - postgis_network
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_postgis
    restart: unless-stopped
    ports:
      - "8433:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: aa@aa.com
      PGADMIN_DEFAULT_PASSWORD: aa
    depends_on:
      - postgis
    networks:
      - postgis_network

networks:
  postgis_network:
